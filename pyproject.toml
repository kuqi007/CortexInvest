[project]
name = "a-share-investment-agent"
version = "0.1.0"
description = "An AI-powered hedge fund that uses multiple agents to make trading decisions"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.11,<0.3.0",
    "langgraph>=0.2.56,<0.3.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.9.2,<4.0.0",
    "yfinance>=0.2.51,<1.0.0",
    "akshare>=1.11.22,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.3",
    "openai>=1.12.0,<2.0.0",
    "langchain-core>=0.3.29,<0.4.0",
    "google-generativeai>=0.3.0,<0.4.0",
    "backoff>=2.2.1",
    "google-genai>=0.6.0,<1.0.0",
    "uvicorn>=0.34.0",
    "fastapi>=0.115.12,<0.116.0",
    "playwright>=1.52.0,<2.0.0",
    "rich>=13.7.0",
    "futu-api>=9.6.5608,<10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<10.0.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/sim_trading"]
